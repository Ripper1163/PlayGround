<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D GORE spiel</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg-1: #04070d;
        --bg-2: #0b1320;
        --hud: rgba(6, 10, 15, 0.78);
        --panel: rgba(17, 24, 35, 0.9);
        --line: rgba(145, 173, 255, 0.42);
        --text: #edf4ff;
        --muted: #8ba0c2;
        --danger: #ff5a6a;
        --warn: #ffb34d;
        --good: #73f8af;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(67, 103, 160, 0.28), transparent 40%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      #game-shell {
        position: relative;
        width: min(100vw, 1200px);
        height: min(100vh, 800px);
        border: 1px solid var(--line);
        background: rgba(5, 7, 14, 0.78);
        box-shadow: 0 25px 80px rgba(0,0,0,0.56);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #09131d 0%, #050b12 100%);
      }

      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .topbar {
        position: absolute;
        top: 18px;
        left: 18px;
        right: 18px;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
      }

      .panel {
        background: var(--hud);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 15px 35px rgba(0,0,0,0.2);
      }

      .stats {
        display: flex;
        gap: 10px;
        padding: 10px 14px;
      }

      .stat {
        min-width: 88px;
      }

      .stat-label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat-value {
        display: block;
        margin-top: 4px;
        font-size: 18px;
        font-weight: 700;
      }

      #level-badge {
        padding: 10px 14px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--good);
        text-shadow: 0 0 16px rgba(115, 248, 175, 0.6);
      }

      .bottom-bar {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        z-index: 2;
      }

      .controls {
        display: flex;
        gap: 8px;
        padding: 9px 12px;
      }

      .control-key {
        min-width: 32px;
        text-align: center;
        padding: 7px 10px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        font-weight: 700;
        font-size: 12px;
      }

      .mission {
        max-width: 360px;
        padding: 12px 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .mission strong {
        color: var(--text);
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        background: rgba(2, 4, 9, 0.54);
        backdrop-filter: blur(6px);
        transition: opacity 180ms ease;
      }

      .overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .modal {
        width: min(92vw, 540px);
        padding: 28px 22px 22px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(12, 16, 22, 0.92);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }

      .modal h1 {
        margin: 0 0 10px;
        font-size: clamp(2.1rem, 3vw, 3.1rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .modal h1.accent { color: var(--warn); }
      .modal h1.good { color: var(--good); }

      .modal p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1rem;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: linear-gradient(180deg, #f2994a, #d76f3a);
        color: #1b120d;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.04em;
        padding: 12px 18px;
        cursor: pointer;
        box-shadow: 0 16px 30px rgba(227, 110, 51, 0.4);
      }

      button:active { transform: translateY(1px); }

      @media (max-width: 740px) {
        .topbar, .bottom-bar {
          left: 10px;
          right: 10px;
          gap: 8px;
        }

        .stats {
          scale: 0.9;
          transform-origin: left center;
        }

        .mission {
          max-width: 220px;
          padding: 10px 12px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <canvas id="game-canvas"></canvas>

      <div class="hud">
        <div class="topbar">
          <div class="panel stats">
            <div class="stat">
              <span class="stat-label">Health</span>
              <span id="health" class="stat-value">100</span>
            </div>
            <div class="stat">
              <span class="stat-label">Score</span>
              <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Combo</span>
              <span id="combo" class="stat-value">x1</span>
            </div>
          </div>
          <div id="level-badge" class="panel">Sector 01</div>
        </div>

        <div class="bottom-bar">
          <div class="panel controls">
            <div class="control-key">W</div>
            <div class="control-key">A</div>
            <div class="control-key">S</div>
            <div class="control-key">D</div>
            <div class="control-key">Jump</div>
          </div>
          <div class="panel mission">
            <strong>Mission:</strong> close in to strike plagues, harvest cells, and survive all five sectors.
          </div>
        </div>
      </div>

      <div id="overlay" class="overlay">
        <div class="modal">
          <h1 id="overlay-title" class="accent">3D GORE spiel</h1>
          <p id="overlay-text">WASD to move. Space to leap. Eliminate all red plagues to clear the zone.</p>
          <button id="start-button">Start Run</button>
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three';

      const canvas = document.getElementById('game-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x08121b);
      scene.fog = new THREE.Fog(0x08121b, 18, 42);

      const camera = new THREE.PerspectiveCamera(62, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
      camera.position.set(0, 5.8, 11);

      const clock = new THREE.Clock();
      const keys = {};
      const world = {
        player: null,
        enemies: [],
        pickups: [],
        attacked: false,
        health: 100,
        score: 0,
        combo: 1,
        level: 1,
        time: 0,
        attackCooldown: 0,
        damageCooldown: 0,
        ended: false,
        started: false,
      };

      const ui = {
        health: document.getElementById('health'),
        score: document.getElementById('score'),
        combo: document.getElementById('combo'),
        level: document.getElementById('level-badge'),
        overlay: document.getElementById('overlay'),
        title: document.getElementById('overlay-title'),
        text: document.getElementById('overlay-text'),
        button: document.getElementById('start-button'),
      };

      function setOverlay(title, text, buttonText = 'Restart Run', accent = 'accent') {
        ui.title.textContent = title;
        ui.title.className = accent;
        ui.text.textContent = text;
        ui.button.textContent = buttonText;
        ui.overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        ui.overlay.classList.add('hidden');
      }

      function addLights() {
        const hemi = new THREE.HemisphereLight(0x8ec9ff, 0x0b1117, 0.72);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffd8b5, 1.15);
        sun.position.set(7, 16, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 40;
        sun.shadow.camera.left = -20;
        sun.shadow.camera.right = 20;
        sun.shadow.camera.top = 20;
        sun.shadow.camera.bottom = -20;
        scene.add(sun);
      }

      function createArena() {
        const grid = new THREE.Group();
        const floor = new THREE.Mesh(
          new THREE.CylinderGeometry(13, 13, 1.3, 64),
          new THREE.MeshStandardMaterial({ color: 0x111d2d, emissive: 0x081924, metalness: 0.15, roughness: 0.9 })
        );
        floor.position.y = -1.75;
        floor.receiveShadow = true;
        grid.add(floor);

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(10.5, 0.28, 12, 96),
          new THREE.MeshStandardMaterial({ color: 0x7d9dff, emissive: 0x1d2d50, roughness: 0.35, metalness: 0.7 })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.95;
        grid.add(ring);

        for (let i = 0; i < 14; i++) {
          const col = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 3, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x192b3a, emissive: 0x0d1828, roughness: 0.8 })
          );
          const angle = (i / 14) * Math.PI * 2;
          col.position.set(Math.cos(angle) * 9.5, 0.4, Math.sin(angle) * 9.5);
          col.castShadow = true;
          col.receiveShadow = true;
          grid.add(col);
        }

        scene.add(grid);
      }

      function createPlayer() {
        const group = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.6, 1.3, 6, 16),
          new THREE.MeshStandardMaterial({ color: 0x6fe0ff, emissive: 0x123546, roughness: 0.35, metalness: 0.46 })
        );
        body.castShadow = true;
        group.add(body);

        const visor = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.28, 0.3),
          new THREE.MeshStandardMaterial({ color: 0xdff6ff, emissive: 0x5a8eb8, roughness: 0.3 })
        );
        visor.position.set(0, 0.55, 0.36);
        group.add(visor);

        group.position.set(0, 0.3, 0);
        scene.add(group);
        return group;
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createEnemy(level) {
        const root = new THREE.Group();
        const hue = 0.005 + (level * 0.005);
        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.8, 20, 20),
          new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.78, 0.52), emissive: 0x5a0b12, roughness: 0.3, metalness: 0.2 })
        );
        body.scale.set(1, 1.2, 1);
        body.castShadow = true;
        root.add(body);

        const eye = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.16, 0.16),
          new THREE.MeshStandardMaterial({ color: 0xfff6f0, emissive: 0xffa08b, roughness: 0.5 })
        );
        eye.position.set(0, 0.15, 0.7);
        root.add(eye);

        const angle = Math.random() * Math.PI * 2;
        const r = rand(4.5, 9.5);
        root.position.set(Math.cos(angle) * r, 1.3, Math.sin(angle) * r);
        root.userData = {
          speed: rand(1.1, 1.8 + level * 0.3),
          health: 2.2 + level * 0.25,
          pulse: Math.random() * Math.PI * 2,
        };

        scene.add(root);
        return root;
      }

      function createPickup(x, z) {
        const mesh = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.45, 0),
          new THREE.MeshStandardMaterial({ color: 0x7ef7b7, emissive: 0x143324, roughness: 0.35, metalness: 0.7 })
        );
        mesh.castShadow = true;
        mesh.position.set(x, 0.9, z);
        mesh.userData = { bob: Math.random() * Math.PI * 2 };
        scene.add(mesh);
        return mesh;
      }

      function spawnWave() {
        const count = 3 + world.level;
        for (let i = 0; i < count; i++) {
          world.enemies.push(createEnemy(world.level));
        }
        const pickupCount = 3 + world.level;
        for (let i = 0; i < pickupCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = rand(1.5, 8.5);
          world.pickups.push(createPickup(Math.cos(angle) * r, Math.sin(angle) * r));
        }
      }

      function resetGame() {
        world.health = 100;
        world.score = 0;
        world.combo = 1;
        world.level = 1;
        world.time = 0;
        world.attackCooldown = 0;
        world.damageCooldown = 0;
        world.ended = false;
        world.started = true;
        ui.level.textContent = `Sector 0${world.level}`;
        world.player.position.set(0, 0.3, 0);
        for (const enemy of world.enemies) scene.remove(enemy);
        for (const pickup of world.pickups) scene.remove(pickup);
        world.enemies = [];
        world.pickups = [];
        spawnWave();
        updateHUD();
      }

      function updateHUD() {
        ui.health.textContent = Math.max(0, Math.ceil(world.health));
        ui.score.textContent = world.score;
        ui.combo.textContent = `x${world.combo}`;
        ui.level.textContent = `Sector 0${Math.min(world.level, 5)}`;
      }

      function nextLevel() {
        if (world.level >= 5) {
          world.ended = true;
          setOverlay('Victory', 'You survived the gore storm and cleaned the last sector.', 'Play Again', 'good');
          world.started = false;
          return;
        }
        world.level += 1;
        world.score += 100 * world.combo;
        for (const enemy of world.enemies) scene.remove(enemy);
        for (const pickup of world.pickups) scene.remove(pickup);
        world.enemies = [];
        world.pickups = [];
        spawnWave();
        updateHUD();
      }

      function hitPlayer(amount) {
        if (world.ended) return;
        world.health = Math.max(0, world.health - amount);
        world.attacked = true;
        updateHUD();
        if (world.health <= 0) {
          world.ended = true;
          world.started = false;
          setOverlay('Run Failed', 'The plague overwhelmed you. Reboot and try another run.', 'Restart Run', 'accent');
        }
      }

      function attackEnemies() {
        if (world.attackCooldown > 0) return;
        const playerPos = world.player.position;
        let hit = false;
        let cleared = 0;
        for (let i = world.enemies.length - 1; i >= 0; i--) {
          const enemy = world.enemies[i];
          if (enemy.position.distanceTo(playerPos) < 1.65) {
            hit = true;
            enemy.userData.health -= 1.15;
            if (enemy.userData.health <= 0) {
              scene.remove(enemy);
              world.enemies.splice(i, 1);
              world.score += 12 * world.combo;
              world.combo = Math.min(8, world.combo + 0.25);
              cleared += 1;
            }
          }
        }

        if (hit) world.attackCooldown = 0.38;
        if (cleared > 0 && world.enemies.length === 0) nextLevel();
      }

      function handleCollectibles() {
        const playerPos = world.player.position;
        for (let i = world.pickups.length - 1; i >= 0; i--) {
          const pickup = world.pickups[i];
          if (pickup.position.distanceTo(playerPos) < 1.3) {
            scene.remove(pickup);
            world.pickups.splice(i, 1);
            world.score += 25;
            world.health = Math.min(100, world.health + 9);
            world.combo = Math.min(8, world.combo + 0.2);
          }
        }
        updateHUD();
      }

      function updatePlayer(dt) {
        const move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;

        if (move.lengthSq() > 0) {
          move.normalize();
          const speed = 5.5;
          world.player.position.addScaledVector(move, speed * dt);
          world.player.position.x = THREE.MathUtils.clamp(world.player.position.x, -9.8, 9.8);
          world.player.position.z = THREE.MathUtils.clamp(world.player.position.z, -9.8, 9.8);
          const angle = Math.atan2(move.x, move.z);
          world.player.rotation.y = angle;
        }

        if (keys['Space'] && world.player.position.y < 0.35) {
          world.player.position.y = 1.2;
          world.player.userData.vy = 8.2;
        }

        if (world.player.userData.vy) {
          world.player.position.y += world.player.userData.vy * dt;
          world.player.userData.vy -= 15 * dt;
          if (world.player.position.y < 0.3) {
            world.player.position.y = 0.3;
            world.player.userData.vy = 0;
          }
        }
      }

      function updateEnemies(dt) {
        const playerPos = world.player.position;
        for (const enemy of world.enemies) {
          const data = enemy.userData;
          const dx = playerPos.x - enemy.position.x;
          const dz = playerPos.z - enemy.position.z;
          const distance = Math.hypot(dx, dz);
          if (distance > 0) {
            enemy.position.x += (dx / distance) * data.speed * dt;
            enemy.position.z += (dz / distance) * data.speed * dt;
            enemy.rotation.y = Math.atan2(dx, dz);
          }
          enemy.position.y = 1.2 + Math.sin(world.time * 3 + data.pulse) * 0.18;
          const dist = enemy.position.distanceTo(playerPos);
          if (dist < 1.6 && world.damageCooldown <= 0) {
            hitPlayer(9 + world.level * 1.5);
            world.damageCooldown = 0.8;
          }
        }
      }

      function updatePickups(dt) {
        for (const pickup of world.pickups) {
          pickup.rotation.y += dt * 2.2;
          pickup.rotation.x += dt * 1.8;
          pickup.position.y = 0.9 + Math.sin(world.time * 5 + pickup.userData.bob) * 0.35;
        }
      }

      function frame() {
        const dt = Math.min(clock.getDelta(), 0.033);
        world.time += dt;
        world.attackCooldown = Math.max(0, world.attackCooldown - dt);
        world.damageCooldown = Math.max(0, world.damageCooldown - dt);

        if (world.started && !world.ended) {
          updatePlayer(dt);
          attackEnemies();
          handleCollectibles();
          updateEnemies(dt);
          updatePickups(dt);
          camera.position.x += (world.player.position.x * 0.3 - camera.position.x) * 0.08;
          camera.position.z += ((world.player.position.z + 11.5) - camera.position.z) * 0.08;
          camera.position.y = 8 + Math.sin(world.time * 1.5) * 0.4;
          camera.lookAt(world.player.position.x, 1.4, world.player.position.z);
        }

        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      function onResize() {
        const { clientWidth, clientHeight } = canvas;
        if (!clientWidth || !clientHeight) return;
        renderer.setSize(clientWidth, clientHeight, false);
        camera.aspect = clientWidth / clientHeight;
        camera.updateProjectionMatrix();
      }

      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', (event) => {
        keys[event.code] = true;
        if (event.code === 'Space') event.preventDefault();
      });
      window.addEventListener('keyup', (event) => { keys[event.code] = false; });

      ui.button.addEventListener('click', () => {
        if (!world.started) {
          resetGame();
          hideOverlay();
        }
      });

      addLights();
      createArena();
      world.player = createPlayer();
      world.player.userData = { vy: 0 };
      updateHUD();
      setOverlay('3D GORE spiel', 'WASD to move. Space to leap. Get close to red plagues to strike them, collect green cells, and clear all five sectors.', 'Start Run', 'accent');
      onResize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
